; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sin esto, "pio run" a secas procesaria TAMBIEN el entorno de prueba de los
; controles, y con -t upload dejaria el sketch de prueba flasheado en la placa
; en lugar de la consola. El de prueba se pide siempre con -e test-controles.
[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps =
    ESP32Async/AsyncTCP@^3.4.10
    ESP32Async/ESPAsyncWebServer@^3.11.2
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/DHT sensor library@^1.4.7
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    fastled/FastLED@^3.9.13

; Sketch de puesta a punto de los controles nuevos (ADS1115 + botones), aparte
; de la consola: build_src_filter saca todo src/ y deja solo el archivo de
; prueba, asi el firmware de la consola no se toca.
;   ~/.platformio/penv/bin/pio run -e test-controles -t upload -t monitor
[env:test-controles]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../scripts-y-pruebas/test-controles.cpp>